name: Construir APK

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'desktop/**', '.github/workflows/desktop.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Nombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk VisorUrbanoSPGG.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VisorUrbanoSPGG
          path: VisorUrbanoSPGG.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Visor Urbano SPGG ${{ github.run_number }}
          files: VisorUrbanoSPGG.apk
          make_latest: true
