name: Construir APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon

      - name: Nombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk VisorUrbanoSPGG.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VisorUrbanoSPGG
          path: VisorUrbanoSPGG.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Visor Urbano SPGG ${{ github.run_number }}
          files: VisorUrbanoSPGG.apk
          make_latest: true
